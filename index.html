  .tool-toggle input { accent-color: #58a6ff; margin: 0; }

  @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .card h2 { margin: 0; font-size: 19px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
  .row { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; margin-bottom: 13px; }
  .rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
          font-weight: 800; font-size: 14px; color: #111; }
  .r1 { background: var(--gold); } .r2 { background: var(--silver); } .r3 { background: var(--bronze); }
  .rn { background: #30363d; color: var(--text); }
  .name { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .name .tool { font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 5px; margin-right: 6px; color: #0d1117; }
  .name b { font-size: 15px; }
  .name .mnote { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .bar { height: 10px; background: #0d1117; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; transition: width .45s ease; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
  .meta .x { color: var(--text); }
  .meta .warn { color: var(--bad); }
  details { margin-top: 18px; }
  details.card { padding: 16px 22px; }
  summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #21262d; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td.best { color: var(--gold); font-weight: 700; }
  td.fail { color: var(--bad); }
  .sc { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: #21262d; color: var(--muted); margin-left: 4px; }
  .notes { margin-top: 24px; color: var(--muted); font-size: 13px; padding-left: 18px; }
  .notes li { margin-bottom: 5px; }
  .notes a { color: #58a6ff; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

  return Object.values(by).map(g => ({ ...g, avgCost: avg(g.cost), avgSec: avg(g.sec),
    avgScore: avg(g.score), totCost: g.cost.reduce((x, y) => x + y, 0) }));
}

function label(r) {
  return `<span><span class="tool" style="background:${COLORS[r.key] || "#58a6ff"}">${esc(r.tool)}</span>` +
         `<b>${esc(r.model)}</b>${r.note ? `<span class="mnote">${esc(r.note)}</span>` : ""}</span>`;
}

function ladder(el, rows, field, fmt, extra) {
  rows = rows.filter(r => r[field] != null).sort((a, b) => a[field] - b[field]);
  if (!rows.length) { el.innerHTML = '<p class="hint">没有选中的组合</p>'; return; }
  const max = Math.max(...rows.map(r => r[field])), best = rows[0][field];
  el.innerHTML = rows.map((r, i) => `<div class="row">
      <div class="rank ${i < 3 ? "r" + (i + 1) : "rn"}">${i + 1}</div>
      <div>
        <div class="name">${label(r)}<span class="val">${fmt(r[field])}</span></div>
        <div class="bar"><i style="width:${(r[field] / max * 100).toFixed(1)}%;background:${COLORS[r.key] || "#58a6ff"}"></i></div>
        <div class="meta">
          <span class="${r.pass < r.n ? "warn" : ""}">通过 ${r.pass}/${r.n}</span>
          <span>平均得分 <span class="x">${Math.round(r.avgScore * 100)}%</span></span>
          ${i ? `<span>第 1 名的 <span class="x">${(r[field] / best).toFixed(1)}×</span></span>` : "<span>🏆 最优</span>"}
          ${extra(r)}
        </div>
      </div></div>`).join("");
}

function taskTable(el, runs, field, fmt) {
  const tasks = [...new Set(DATA.runs.map(r => r.task))].filter(t => runs.some(r => r.task === t));
  const targets = aggregate(runs).sort((a, b) => a.tool.localeCompare(b.tool) || a.model.localeCompare(b.model));
  const pick = (t, g) => runs.filter(r => r.task === t && r.target === g.target);
  const mins = Object.fromEntries(tasks.map(t => [t, Math.min(...targets.map(g => avg(pick(t, g).map(r => r[field]).filter(v => v != null)) ?? Infinity))]));
  let h = `<table><tr><th>组合</th>${tasks.map(t => `<th>${esc(t)}${runs.find(r => r.task === t).tier === "hard" ? '<span class="tag">难</span>' : ""}</th>`).join("")}</tr>`;
  for (const g of targets) {
    h += `<tr><td><span class="dot" style="background:${COLORS[g.key]}"></span>${esc(g.tool)} · ${esc(g.model)}</td>`;
    for (const t of tasks) {
      const rs = pick(t, g), v = avg(rs.map(r => r[field]).filter(x => x != null));
      const sc = avg(rs.map(r => r.score).filter(x => x != null)), failed = rs.some(r => !r.passed);
      const cls = failed ? "fail" : (v === mins[t] ? "best" : "");
      h += `<td class="${cls}">${fmt(v)}${sc != null && sc < 1 ? `<span class="sc">${Math.round(sc * 100)}%</span>` : ""}</td>`;
    }
    h += "</tr>";
  }
  el.innerHTML = h + "</table>";
}

function render() {
  const runs = DATA.runs.filter(r => (state.tier === "all" || r.tier === state.tier) && state.tools.has(r.tool));
  const agg = aggregate(runs);
  ladder(document.getElementById("cost"), agg, "avgCost", fmtUsd, r => `<span>合计 ${fmtUsd(r.totCost)}</span>`);
  ladder(document.getElementById("speed"), agg, "avgSec", fmtSec, () => "");
  taskTable(document.getElementById("cost-t"), runs, "cost_usd", fmtUsd);
  taskTable(document.getElementById("speed-t"), runs, "seconds", fmtSec);
}

(function init() {
  const tasks = [...new Set(DATA.runs.map(r => r.task))];
  const targets = [...new Set(DATA.runs.map(r => r.target))];
  const tools = [...new Set(DATA.runs.map(r => r.tool))];
  const passed = DATA.runs.filter(r => r.passed).length;
  tools.forEach(t => state.tools.add(t));
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("sub").textContent =
    `同一批编码任务，由不同「工具 + 模型」组合独立完成，并用 pytest / LLM 评分验证。测试日期 ${DATA.run_date}。`;
  document.getElementById("chips").innerHTML = [
    `${tools.length} 个工具`, `${targets.length} 个组合`, `${tasks.length} 个任务`, `${DATA.runs.length} 次运行`,
    `通过率 ${Math.round(passed / DATA.runs.length * 100)}%`, "每任务 1 次重复",
  ].map(s => `<span class="chip">${s}</span>`).join("");

  const tt = document.getElementById("tools");
  tt.innerHTML = tools.map(t => {
    const key = DATA.runs.find(r => r.tool === t).key;
    return `<label><input type="checkbox" value="${esc(t)}" checked><span class="dot" style="background:${COLORS[key]}"></span>${esc(t)}</label>`;
  }).join("");
  tt.addEventListener("change", e => { e.target.checked ? state.tools.add(e.target.value) : state.tools.delete(e.target.value); render(); });

  document.getElementById("tiers").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#tiers button").forEach(x => x.classList.toggle("on", x === b));
    state.tier = b.dataset.tier; render();
  });

  const notes = Object.entries(DATA.tool_notes).filter(([t]) => tools.includes(t))
    .map(([t, n]) => `<li><b>${esc(t)}</b> 成本口径：${esc(n)}</li>`);
  notes.push("<li><b>Kiro auto</b>：据内部资料，当前时间点 auto 路由到 Opus 4.8，极少数情况下会降为 Opus 4.6；按 1.0× credit 倍率计费。</li>");
  notes.push("<li>「通过」使用各任务自己的阈值（困难任务为 75% 测试通过）；平均得分是 pytest 通过比例 / 评分项满足比例。红色格子表示该次未通过。</li>");
  notes.push("<li>Codex 走 Amazon Bedrock（us-east-1）；Claude Code 走 Amazon Bedrock（us-west-2）；Kiro 使用 Kiro 账号额度。</li>");
  notes.push("<li>每个任务只跑 1 次、任务数也有限，排名仅供参考。</li>");
  notes.push('<li>数据由 <a href="https://github.com/aws-samples/sample-agent-cost-bench">agent-cost-bench</a> 生成，聚合数据见 <a href="data.json">data.json</a>。</li>');
  document.getElementById("notes").innerHTML = notes.join("");
  render();
})();
</script>
</body>
